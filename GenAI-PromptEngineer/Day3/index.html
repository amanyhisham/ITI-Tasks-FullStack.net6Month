 <!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat with AmanyHeshamAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">AmanyHeshamAI</span>
      </div>
      <button class="btn-new" id="btnNewChat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
      </button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-footer">
      <div class="footer-note">Powered by Fireworks AI</div>
    </div>
  </aside>

  <!-- MOBILE OVERLAY -->
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <button class="burger" id="burgerBtn" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">AmanyHeshamAI</div>
      <select class="mode-select" id="modeSelect">
        <option value="chat">💬 Text Chat</option>
        <option value="image">🖼 Image Generation</option>
        <option value="edit">✏️ Image Edit</option>
      </select>
    </header>

    <div class="chat-area" id="chatArea"></div>

    <div class="input-zone">
      <!-- Image Edit upload row -->
      <div class="upload-row" id="uploadRow" style="display:none">
        <label class="upload-label" id="uploadLabel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span id="uploadText">Upload Image</span>
          <input type="file" id="imageFile" accept="image/*" style="display:none">
        </label>
        <div class="preview-wrap" id="previewWrap" style="display:none">
          <img id="previewImg" src="" alt="preview">
          <button class="remove-preview" onclick="removeUpload()">✕</button>
        </div>
      </div>

      <div class="input-row">
        <textarea id="promptInput" placeholder="Ask me anything…" rows="1"></textarea>
        <button class="send-btn" id="sendBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>

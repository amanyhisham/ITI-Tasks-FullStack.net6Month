<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickSort Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Sorting Algorithm Demo</h1>
      <p>
        Enter numbers separated by commas, choose an algorithm, then click the
        button to sort them.
      </p>

      <label for="number-input" class="field-label">Numbers</label>
      <textarea
        id="number-input"
        placeholder="e.g. 8, 3, 5, 1, 2"
        rows="4"
      ></textarea>

      <label for="algorithm-select" class="field-label">Algorithm</label>
      <select id="algorithm-select">
        <option value="quickSort">QuickSort</option>
        <option value="mergeSort">MergeSort</option>
        <option value="bubbleSort">BubbleSort</option>
      </select>

      <button id="sort-button" type="button">Sort</button>

      <div id="error-message" class="error-message"></div>

      <section class="result-card">
        <h2>Sorted result</h2>
        <div id="sorted-output" class="result-output">No result yet</div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorting Visualization</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 20px;
      }
      canvas {
        border: 1px solid #000;
        margin-top: 20px;
      }
      button {
        margin: 10px;
        padding: 10px 20px;
      }
    </style>
  </head>
  <body>
    <h1>Sorting Algorithm Visualization</h1>
    <button id="start-btn">Start BubbleSort Animation</button>
    <canvas id="canvas" width="800" height="400"></canvas>
    <script src="script.js"></script>
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const startBtn = document.getElementById("start-btn");

      let array = [];
      let steps = [];
      let currentStep = 0;
      let animationId;

      function generateArray(size = 50) {
        array = [];
        for (let i = 0; i < size; i++) {
          array.push(Math.floor(Math.random() * 300) + 10);
        }
      }

      function drawArray(arr, highlight = []) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const barWidth = canvas.width / arr.length;
        for (let i = 0; i < arr.length; i++) {
          const barHeight = arr[i];
          const x = i * barWidth;
          const y = canvas.height - barHeight;
          ctx.fillStyle = highlight.includes(i) ? "red" : "blue";
          ctx.fillRect(x, y, barWidth - 1, barHeight);
        }
      }

      function bubbleSortSteps(arr) {
        const array = [...arr];
        steps = [];
        for (let i = 0; i < array.length; i++) {
          for (let j = 0; j < array.length - 1 - i; j++) {
            steps.push({ array: [...array], highlight: [j, j + 1] });
            if (array[j] > array[j + 1]) {
              [array[j], array[j + 1]] = [array[j + 1], array[j]];
              steps.push({ array: [...array], highlight: [j, j + 1] });
            }
          }
        }
        steps.push({ array: [...array], highlight: [] });
      }

      function animate() {
        if (currentStep < steps.length) {
          const step = steps[currentStep];
          drawArray(step.array, step.highlight);
          currentStep++;
          setTimeout(animate, 50);
        } else {
          drawArray(steps[steps.length - 1].array);
          startBtn.disabled = false;
        }
      }

      startBtn.addEventListener("click", () => {
        startBtn.disabled = true;
        generateArray();
        bubbleSortSteps(array);
        currentStep = 0;
        animate();
      });

      // Initial draw
      generateArray();
      drawArray(array);
    </script>
  </body>
</html>
